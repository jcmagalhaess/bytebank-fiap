<div class="flex items-center justify-center gap-2" [class]="class">
  <!-- Ícone de upload animado -->
  <div class="relative">
    <svg
      class="w-4 h-4 text-blue-600 animate-bounce"
      fill="none"
      stroke="currentColor"
      viewBox="0 0 24 24"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"
      />
    </svg>

    <!-- Círculo de progresso -->
    <div class="absolute -top-1 -right-1 h-2 w-2 bg-blue-600 rounded-full animate-ping"></div>
  </div>

  <span class="text-sm text-blue-600 font-medium">Carregando...</span>
</div>
