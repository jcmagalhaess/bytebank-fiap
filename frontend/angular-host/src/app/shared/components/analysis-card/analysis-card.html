<div
  class="bg-white rounded-3xl shadow-md flex relative"
  [ngClass]="{
    'flex-col sm:flex-row gap-4 sm:gap-10 px-4 sm:px-7 py-6 sm:py-14': isHorizontal(),
    'flex-col gap-3 sm:gap-5 p-4 sm:p-7': isVertical()
  }"
>
  <div class="flex gap-3 items-center">
    <div class="w-12 h-12 sm:w-16 sm:h-16 rounded-2xl {{ color() }} flex items-center justify-center">
      @if (urlImage()) {
      <img [src]="urlImage()" alt="" class="w-6 h-6 sm:w-8 sm:h-8" />
      }
    </div>
    <h4 class="text-[#B3B3B3] text-sm sm:text-base">{{ label() }}</h4>
  </div>
  <div class="flex gap-3 items-center">
    <h5 class="text-xl sm:text-3xl">
      <strong>{{ price() | currency : 'BRL' }}</strong>
    </h5>
  </div>
</div>
