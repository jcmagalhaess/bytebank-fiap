<header
  class="w-full h-16 sm:h-20 bg-brandSecondary text-backgroundPrimary px-4 sm:px-lg py-sm flex items-center justify-between font-inter"
>
  <!-- Logo -->
  <a routerLink="/" class="cursor-pointer flex items-center">
    <img src="/logo_bytebank.png" alt="Bytebank Logo" class="h-6 sm:h-8 w-auto" />
  </a>

  <!-- Nome do usuário e avatar -->
  <div class="flex items-center gap-2 sm:gap-xs">
    @if (authService.isAuthenticated() && authService.user()) {
    <span class="text-xs sm:text-sm text-backgroundPrimary hidden sm:block">{{
      getFirstName(authService.account()?.nome!)
    }}</span>
    <div class="relative group">
      <div
        class="w-8 h-8 sm:w-9 sm:h-9 bg-transparent rounded-full flex items-center justify-center cursor-pointer"
      >
        <app-avatar-icon class="text-backgroundPrimary text-xl sm:text-2xl"></app-avatar-icon>
      </div>
      <!-- Dropdown menu -->
      <div
        class="absolute right-0 mt-2 w-40 sm:w-48 bg-backgroundPrimary rounded-md shadow-md opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 z-50"
      >
        <div class="py-1">
          <div
            class="px-3 sm:px-4 py-2 text-xs sm:text-sm text-textSecondary border-b border-backgroundSecondary"
          >
            {{ authService.account()?.email }}
          </div>
          <button
            (click)="handleLogout()"
            class="block w-full text-left px-3 sm:px-4 py-2 text-xs sm:text-sm text-textPrimary hover:bg-backgroundSecondary transition-colors"
          >
            Sair
          </button>
        </div>
      </div>
    </div>
    } @else {
    <!-- Botão de Login Simples -->
    <button
      (click)="handleLogin()"
      [disabled]="authService.isLoading()"
      class="bg-brandPrimary text-backgroundPrimary px-3 sm:px-4 py-2 rounded-lg hover:bg-brandPrimaryHover transition-colors disabled:opacity-50 text-xs sm:text-sm"
    >
      @if (authService.isLoading()) { Entrando... } @else { Entrar }
    </button>
    }
  </div>
</header>
