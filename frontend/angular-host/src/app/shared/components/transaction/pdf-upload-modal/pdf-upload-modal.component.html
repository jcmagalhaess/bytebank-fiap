@if (isOpen) {
  <div class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 z-50">
    <div class="bg-white rounded-xl shadow-lg max-w-md w-full mx-4">
      <!-- Header -->
      <div class="flex items-center justify-between p-6 border-b border-backgroundSecondary">
        <h3 class="text-lg font-semibold text-textPrimary">
          Anexar Comprovante
        </h3>
        <button
          (click)="onClose()"
          class="text-textSecondary hover:text-textPrimary transition-colors">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- Content -->
      <div class="p-6">
        @if (errorMessage) {
          <div class="mb-4 p-3 bg-red-50 border border-red-200 text-red-700 rounded-lg">
            {{ errorMessage }}
          </div>
        }

        <!-- Upload Area -->
        <div class="mb-6">
          <label class="block text-sm font-medium text-textPrimary mb-2">
            Selecione um arquivo PDF
          </label>
          <div class="relative">
            <input
              type="file"
              accept=".pdf"
              (change)="onPdfChange($event)"
              class="hidden"
              id="pdf-upload"
              [disabled]="pdfUploading">
            <label
              for="pdf-upload"
              [class]="'flex items-center justify-center gap-2 px-4 py-6 border-2 border-dashed rounded-lg cursor-pointer transition-colors duration-200 ' +
                (pdfUploading
                  ? 'border-brandPrimary bg-backgroundSecondary cursor-not-allowed'
                  : pdfUploaded
                  ? 'border-feedbackSuccess bg-backgroundSecondary'
                  : 'border-backgroundSecondary hover:border-brandPrimary hover:bg-backgroundSecondary')">

              @if (pdfUploading) {
                <app-pdf-upload-loader></app-pdf-upload-loader>
                <span class="text-sm text-textPrimary">Carregando...</span>
              } @else if (pdfUploaded) {
                <svg class="w-5 h-5 text-feedbackSuccess" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span class="text-sm text-feedbackSuccess">{{ pdfFile?.name }}</span>
                <button
                  type="button"
                  (click)="removePdf()"
                  class="ml-2 text-feedbackDanger hover:text-red-700">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                  </svg>
                </button>
              } @else {
                <svg class="w-5 h-5 text-textSecondary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                </svg>
                <span class="text-sm text-textSecondary">Clique para selecionar um PDF</span>
              }
            </label>
          </div>
          <p class="text-xs text-textSecondary mt-2">
            Apenas arquivos PDF são permitidos. Tamanho máximo: 5MB
          </p>
        </div>

        <!-- Actions -->
        <div class="flex justify-end gap-3">
          <app-button
            variant="secondary"
            (click)="onClose()">
            Cancelar
          </app-button>
          <app-button
            variant="primary"
            (click)="onConfirmUpload()"
            [disabled]="!pdfUploaded || pdfUploading">
            @if (pdfUploading) {
              Anexando...
            } @else {
              Anexar
            }
          </app-button>
        </div>
      </div>
    </div>
  </div>
}
