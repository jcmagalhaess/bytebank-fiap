@if (!hasTransactions()) {
  <p class="text-textSecondary text-center py-8">
    Nenhuma transação encontrada.
  </p>
} @else {
  <div class="space-y-2">
    <!-- Lista de transações -->
    @for (transaction of currentTransactions(); track $index) {
      <app-transaction-row
        [type]="transaction.type"
        [date]="formatDate(transaction.date)"
        [categoria]="transaction.categoria"
        [amount]="formatToBRL(transaction.amount)"
        [descricao]="transaction.descricao"
        [pdfUrl]="transaction.pdfUrl"
        [pdfFileName]="transaction.pdfFileName"
        (edit)="handleEdit(transaction)"
        (delete)="handleDelete(transaction.id)"
      />
    }
  </div>
}
