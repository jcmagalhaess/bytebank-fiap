<div
  class="bg-[#F1F7FC] flex flex-col gap-md h-[100%] max-w-full mb-6 overflow-x-auto p-4 relative shadow-md sm:p-6 w-full rounded-3xl"
>
  <div class="flex flex-col md:flex-row justify-between items-center mb-4">
    <div class="w-full">
      <div class="flex flex-col md:flex-row gap-4 items-center">
        <div class="flex-1 w-full md:w-auto">
          <div class="relative w-full md:w-[400px]">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <app-search-icon class="text-textSecondary" />
            </div>
            <input
              id="search-transactions-input"
              type="text"
              placeholder="Buscar transação..."
              [value]="filters().search"
              (input)="onSearchChange('descricao', $event.target.value)"
              class="w-full pl-10 pr-10 py-3 border border-backgroundSecondary rounded-lg bg-white text-textPrimary placeholder-textSecondary focus:outline-none focus:ring-2 focus:ring-brandPrimary focus:border-transparent"
            />
            @if (filters().search) {
            <button
              type="button"
              (click)="onSearchChange('', '')"
              class="absolute inset-y-0 right-0 pr-3 flex items-center text-textSecondary hover:text-textPrimary transition-colors duration-200 z-10"
            >
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  strokeLinecap="round"
                  strokeLinejoin="round"
                  strokeWidth="{2}"
                  d="M6 18L18 6M6 6l12 12"
                />
              </svg>
            </button>
            }
          </div>
        </div>

        <div class="flex flex-row items-center gap-2 md:gap-3 w-full md:w-auto">
          <app-button
            variant="tertiary"
            id="filters-toggle-button"
            (pressed)="toggleFilters()"
            [overrideClass]="
              'flex items-center justify-center gap-2 px-3 md:px-4 py-2 md:py-3 bg-[#CDEBFC] text-gray-700 rounded-lg shadow-sm hover:bg-blue-200 transition-colors duration-200 h-9 text-sm md:text-base flex-shrink-0'
            "
          >
            <app-setting-icon class="text-[#0F2C59]" />
            <span class="hidden md:inline">Filtro</span>
            <span class="md:hidden">Filtrar</span>
          </app-button>

          <app-button
            id="add-transaction-button"
            variant="primary"
            (pressed)="openModal()"
            class="flex-1 md:w-auto text-sm md:text-base"
          >
            <span class="hidden md:inline">Adicionar Transação</span>
            <span class="md:hidden">Adicionar</span>
          </app-button>
        </div>
      </div>

      @if (showFilters()) {
      <div class="mt-4">
        <app-transaction-filters
          [filters]="filters()"
          [availableCategories]="availableCategories()"
          (filtersChange)="onFiltersChange($event)"
          (clearFilters)="onClearFilters()"
          [isDropdown]="true"
        />
      </div>
      }
    </div>
  </div>
