<div class="flex flex-row gap-4 lg:gap-8">
  <div class="basis-1/3">
    <app-transactions-form alignAction="start" />
  </div>

  <div class="basis-2/3">
    <div class="bg-white rounded-3xl shadow-md flex relative flex-col gap-3 sm:gap-5 p-4 sm:p-7">
      <div class="flex justify-between">
        <h2 class="text-lg font-semibold text-[#0A2A4D]">Últimas transações</h2>

        <a routerLink="/dashboard/transactions" class="text-sm font-medium text-brandPrimary"
          >Ver extrato completo →</a
        >
      </div>
      <app-transactions-table
        [list]="transactions()"
        [loading]="loading()"
        (delete)="deleteTransaction($event)"
        (edit)="openModalEdit($event)"
        (pdfUpload)="openModalUpload($event)"
        (pdfView)="openModalViewPDF($event)"
      />
    </div>
  </div>
</div>
