<div class="flex flex-col lg:flex-row gap-4 lg:gap-8">
  <!-- Formulário de transações -->
  <div class="w-full lg:basis-1/3 lg:max-w-md">
    <app-transactions-form alignAction="start" />
  </div>

  <!-- Tabela de transações -->
  <div class="w-full lg:basis-2/3">
    <div class="bg-white rounded-3xl shadow-md flex relative flex-col gap-3 sm:gap-5 p-4 sm:p-6 lg:p-7">
      <div class="flex flex-col sm:flex-row sm:justify-between gap-2 sm:gap-0">
        <h2 class="text-base sm:text-lg font-semibold text-[#0A2A4D]">Últimas transações</h2>
        <a
          routerLink="/dashboard/transactions"
          class="text-sm font-medium text-brandPrimary hover:text-brandPrimary/80 transition-colors inline-flex items-center"
        >
          Ver extrato completo
          <i class="fa-solid fa-arrow-right ml-1 text-xs"></i>
        </a>
      </div>

      <!-- Container da tabela com scroll horizontal em mobile -->
      <div class="overflow-x-auto -mx-4 sm:mx-0">
        <div class="min-w-full px-4 sm:px-0">
          <app-transactions-table
            [list]="transactions()"
            [loading]="loading()"
            (delete)="deleteTransaction($event)"
            (edit)="openModalEdit($event)"
            (pdfUpload)="openModalUpload($event)"
            (pdfView)="openModalViewPDF($event)"
          />
        </div>
      </div>
    </div>
  </div>
</div>
