<div class="grid grid-cols-1 lg:grid-cols-2 gap-4 lg:gap-8">
  <div class="bg-white rounded-3xl shadow-md p-4 lg:p-7 h-[300px] lg:h-[384px]">
    <app-chart
      [data]="_accountService.monthlyChartData().datasets"
      [labels]="_accountService.monthlyChartData().labels"
      type="bar"
      indexAxis="x"
      [stacked]="true"
    />
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-2 gap-4 lg:gap-8">
    <app-analysis-card label="Receitas" type="income" [price]="_accountService.userCredits()" />
    <app-analysis-card label="Despesas" type="expense" [price]="_accountService.userDebits()" />

    <div class="col-span-1 sm:col-span-2 lg:col-span-2">
      <app-analysis-card
        label="Balanço"
        type="balance"
        alignment="horizontal"
        [price]="_accountService.userBalance()"
      />
    </div>
  </div>
</div>
