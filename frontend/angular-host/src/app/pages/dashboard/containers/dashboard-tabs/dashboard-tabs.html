<div class="pt-8 sm:pt-12 lg:pt-16 pb-16 sm:pb-20 lg:pb-24 w-full dashboard__header">
  <div class="flex flex-col lg:flex-row w-full px-4 lg:w-8/12 m-auto justify-between relative z-10 gap-4 lg:gap-0">
    <!-- Conteúdo do header -->
    <div class="text-white flex-1">
      @if (isTransactionsPage()) {
        <h2 class="text-2xl sm:text-3xl lg:text-5xl font-bold leading-tight">Extrato de transações</h2>
        <p class="text-sm lg:text-base opacity-0 mt-2">Espaçador</p>
      } @else {
        <h2 class="text-2xl sm:text-3xl lg:text-5xl font-bold leading-tight">Olá, {{ username() }}!</h2>
        <p class="text-sm lg:text-base mt-2">Seja bem-vindo (a) de volta.</p>
      }
    </div>

    <ul class="dashboard__menu flex flex-wrap gap-0">
      @for (item of navLinks; track item.path) {
      <li>
        <a
          class="dashboard__menu-item text-sm lg:text-base px-3 py-2 lg:px-4 lg:py-2"
          [routerLink]="item.path"
          [class.dashboard__menu-item--active]="isRouteActive(item.path)"
          [attr.data-path]="item.path"
        >
          {{ item.name }}
        </a>
      </li>
      }
    </ul>
  </div>
</div>

<!-- Conteúdo principal com padding responsivo -->
<div class="w-full px-4 sm:px-6 lg:w-8/12 m-auto dashboard__content">
  <router-outlet />
</div>
